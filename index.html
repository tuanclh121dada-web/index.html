<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI Của Tôi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        #chat-container { width: 100%; max-width: 500px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 80%; line-height: 1.5; font-size: 15px; }
        .user-msg { background-color: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background-color: #e9ecef; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: #fff; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 15px; }
        #send-btn { background-color: #007bff; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        #send-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-box">
        <div class="message bot-msg">Chào bạn! Trang web này cần API Key để hoạt động. Xin hãy đảm bảo bạn đã nhập Key.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Nhập câu hỏi của bạn..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    // Cơ chế lưu và hỏi API Key an toàn
    let API_KEY = localStorage.getItem("gemini_api_key");
    if (!API_KEY) {
        API_KEY = prompt("Vui lòng nhập Google Gemini API Key của bạn để sử dụng:");
        if (API_KEY) {
            localStorage.setItem("gemini_api_key", API_KEY);
        } else {
            alert("Bạn chưa nhập API Key! Trang web sẽ không thể trả lời.");
        }
    }

    async function sendMessage() {
        if (!API_KEY) {
            alert("Thiếu API Key! Vui lòng tải lại trang (F5) và nhập Key.");
            return;
        }

        const inputField = document.getElementById('user-input');
        const message = inputField.value.trim();
        if (!message) return;

        addMessage(message, 'user-msg');
        inputField.value = '';

        const typingIndicator = addMessage('Đang suy nghĩ...', 'bot-msg');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: message }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                typingIndicator.innerText = `Lỗi từ Google: ${data.error.message}`;
                if(data.error.code === 400 || data.error.code === 403) {
                     localStorage.removeItem("gemini_api_key"); // Xóa key lỗi
                }
                return;
            }

            const botReply = data.candidates[0].content.parts[0].text;
            typingIndicator.innerText = botReply;

        } catch (error) {
            typingIndicator.innerText = "Lỗi kết nối mạng hoặc API Key không hợp lệ.";
        }
    }

    function addMessage(text, className) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
