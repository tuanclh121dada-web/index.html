
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSA | Hệ thống luyện thi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#172033;font:15px system-ui,Arial}
header{background:linear-gradient(110deg,#7f1d1d,#b91c1c);color:#fff;padding:22px 15px}
header h1{margin:0 0 8px;font-size:23px}
main,.wrap{max-width:980px;margin:auto}
main{padding:14px}
.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:17px;margin:0 0 14px}
h2{font-size:20px;margin:5px 0 15px}
h3{font-size:17px}
button{background:#e2e8f0;color:#172033;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;margin:3px}
button.primary{background:#b91c1c;color:#fff}
button.gold{background:#fbbf24;color:#422006}
button.danger{background:#fee2e2;color:#991b1b}
button:disabled{opacity:.4}
input,textarea,select{display:block;width:100%;font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 0 12px}
textarea{min-height:80px}
label{font-weight:600}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:#64748b;font-size:13px}
.error{color:#b91c1c}
.success{color:#15803d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid .card{margin:0}
.option{display:block;width:100%;text-align:left;margin:8px 0;background:#fff;border:1px solid #cbd5e1}
.option.active{background:#fff1f2;border:2px solid #b91c1c}
.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.numbers button{padding:7px 0;margin:0;font-size:12px}
.numbers .active{background:#991b1b;color:#fff}
.numbers .done{background:#fecaca}
hr{border:0;border-top:1px solid #e2e8f0;margin:17px 0}
.auth{max-width:440px;margin:25px auto}
.question{padding:12px 0;border-bottom:1px solid #e2e8f0}
#notice{display:none;background:#fff3cd;color:#713f12;padding:12px;margin:12px auto;max-width:980px;border-radius:10px;white-space:pre-wrap}
@media(max-width:500px){
.numbers{grid-template-columns:repeat(8,1fr)}
header h1{font-size:20px}
main{padding:9px}
.card{padding:13px}
}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>🎓 TSA | HỆ THỐNG LUYỆN THI</h1>
<div>Đề thi tư duy · Luyện tập · Theo dõi kết quả</div>
<div id="userbar" style="margin-top:8px"></div>
</div>
</header>
<div id="notice"></div>
<main id="app">
<div class="card">Đang khởi động hệ thống…</div>
</main>

<script>
(function(){
'use strict';

const KEY='tsa_single_html_v2';
const SESSION='tsa_current_user_v2';
const PRICE_ONE=20000;
const PRICE_VIP=80000;
const DAY=86400000;

const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
const newId=()=> 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const fmt=n=>Number(n).toLocaleString('vi-VN')+'đ';
const when=n=>n?new Date(n).toLocaleString('vi-VN'):'—';

const sample=[
['Giải phương trình x² − 5x + 6 = 0.',
['x = 2 hoặc x = 3','x = 1 hoặc x = 6','x = −2 hoặc x = −3','Vô nghiệm'],
0,'(x − 2)(x − 3) = 0.'],

['Đạo hàm của x³ − 2x² + 5 là:',
['3x² − 4x','3x² − 2x','x² − 4x','3x − 4'],
0,'Đạo hàm từng hạng tử.'],

['Xác suất tung xúc xắc ra số chẵn là:',
['1/3','1/2','2/3','1/6'],
1,'Có 3 kết quả chẵn trên 6 kết quả.'],

['log₂(8) bằng:',
['2','4','3','8'],
2,'2³ = 8.'],

['Vật đi với vận tốc 12 m/s trong 5 giây. Quãng đường là:',
['17 m','24 m','60 m','120 m'],
2,'s = vt = 60 m.']
];

const demoQuestions=()=>Array.from({length:100},(_,i)=>({
text:sample[i%5][0],
options:[...sample[i%5][1]],
answer:sample[i%5][2],
explain:sample[i%5][3]
}));

const initial=()=>({
users:[
{id:'owner',name:'Quản trị viên',password:'123456',role:'owner',unlocked:[],vipUntil:0},
{id:'khach',name:'Học sinh',password:'123456',role:'guest',unlocked:[],vipUntil:0}
],
exams:[
{id:'tsa43',title:'Đề tổng hợp TSA - Tuần 43/2026',minutes:150,questions:demoQuestions()},
{id:'tsa44',title:'Đề luyện TSA - Tuần 44/2026',minutes:150,questions:demoQuestions()}
],
history:[]
});

let db=initial();
let uid='';
let page='exams';
let mode='login';
let selected='';
let editIndex=-1;
let run=null;
let resultId='';
let error='';
let plan='single';
let storageOK=true;

try{
const raw=localStorage.getItem(KEY);
if(raw){
const parsed=JSON.parse(raw);
if(parsed&&Array.isArray(parsed.users)&&Array.isArray(parsed.exams)&&Array.isArray(parsed.history)){
db=parsed;
}
}
uid=localStorage.getItem(SESSION)||'';
}catch(e){
storageOK=false;
}

function showNotice(s){
$('notice').style.display='block';
$('notice').textContent=s;
}

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(db));
localStorage.setItem(SESSION,uid);
}catch(e){
storageOK=false;
showNotice('Trình duyệt đang chặn lưu dữ liệu. Bạn vẫn có thể dùng thử, nhưng dữ liệu có thể mất khi tải lại.');
}
}

function me(){
return db.users.find(u=>u.id===uid)||null;
}
function exam(){
return db.exams.find(e=>e.id===selected)||null;
}
function owner(){
return me()?.role==='owner';
}
function vip(){
return Number(me()?.vipUntil||0)>Date.now();
}
function allowed(e){
return !!me()&&(owner()||vip()||(me().unlocked||[]).includes(e.id));
}
function btn(text,act,cls='',attrs=''){
return `<button type="button" class="${cls}" data-act="${act}" ${attrs}>${text}</button>`;
}

function dl(name,body,type='text/plain'){
const url=URL.createObjectURL(new Blob([body],{type}));
const a=document.createElement('a');
a.href=url;
a.download=name;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function render(){
const u=me();
$('userbar').textContent=u?
`${u.name} · ${owner()?'👑 OWNER':vip()?'⭐ VIP đến '+when(u.vipUntil):'Tài khoản thường'}`:'';

if(!u){
$('app').innerHTML=`
<div class="card auth">
<h2>${mode==='login'?'Đăng nhập TSA':'Đăng ký tài khoản'}</h2>
<div class="row">
${btn('Đăng nhập','login-mode')}
${btn('Đăng ký','register-mode')}
</div>
<form id="authForm">
${mode==='register'?'<label>Họ và tên</label><input name="name" required>':''}
<label>Tên tài khoản</label>
<input name="username" autocomplete="username" required>
<label>Mật khẩu</label>
<input name="password" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" required>
<p class="error">${esc(error)}</p>
<button type="submit" class="primary">${mode==='login'?'Đăng nhập':'Tạo tài khoản'}</button>
</form>
<p class="muted">Tài khoản được ghi nhớ trên thiết bị hỗ trợ lưu trữ.</p>
</div>`;
return;
}

const nav=`
<div class="row" style="margin-bottom:14px">
${btn('📚 Kho đề','exams')}
${btn('📊 Lịch sử','history')}
${owner()?btn('⚙️ Quản trị','admin'):''}
${btn('👤 Tài khoản','profile')}
${btn('Đăng xuất','logout','danger')}
</div>`;

let html='';

if(page==='exams'){
html=`
<h2>Kho đề TSA</h2>
<p class="muted">Đề mẫu gồm các câu hỏi minh họa lặp lại. OWNER có thể nhập bộ câu hỏi thật.</p>
<div class="grid">
${db.exams.map(e=>`
<div class="card">
<h3>${esc(e.title)}</h3>
<p class="muted">${e.questions.length} câu · ${e.minutes} phút</p>
<p>${allowed(e)?'🔓 Đã mở khóa':'🔒 Chưa mở khóa'}</p>
${btn('Xem đề','select','primary',`data-id="${esc(e.id)}"`)}
</div>`).join('')}
</div>`;
}

else if(page==='detail'){
const e=exam();
html=e?`
<div class="card">
${btn('← Kho đề','exams')}
<h2>${esc(e.title)}</h2>
<p>${e.questions.length} câu · ${e.minutes} phút</p>
${allowed(e)?
`<p class="success">✓ Đã mở khóa</p>
${btn('▶ Bắt đầu thi','start','primary')}`:
`<p>Đề chưa mở khóa.</p>
${btn('🔒 Mở khóa 20.000đ','payment','gold')}`}
</div>`:'<div class="card">Không tìm thấy đề.</div>';
}

else if(page==='payment'){
const e=exam();
html=e?`
<div class="card">
<h2>Mở khóa: ${esc(e.title)}</h2>
<p>Chọn gói:</p>
<label style="display:block">
<input type="radio" name="plan" value="single" ${plan==='single'?'checked':''} style="display:inline;width:auto">
Mua lẻ một đề — ${fmt(PRICE_ONE)}
</label>
<label style="display:block">
<input type="radio" name="plan" value="vip" ${plan==='vip'?'checked':''} style="display:inline;width:auto">
VIP toàn bộ đề trong 30 ngày — ${fmt(PRICE_VIP)}
</label>
<hr>
<p><b>Thanh toán mô phỏng, không chuyển tiền thật.</b></p>
${btn('Xác nhận mở khóa thử','pay','primary')}
${btn('Hủy','detail')}
</div>`:'';
}

else if(page==='room'){
const e=exam();
if(!e||!run){
html='<div class="card">Chưa bắt đầu bài thi.</div>';
}else{
const i=run.index;
const q=e.questions[i];
const seconds=Math.max(0,Math.ceil((run.deadline-Date.now())/1000));
html=`
<div class="card">
<div class="row between">
<b>Câu ${i+1}/${e.questions.length}</b>
<b id="timer" class="error">⏱ ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}</b>
</div>
<p class="muted">${i<40?'Tư duy Toán học':i<60?'Tư duy Đọc hiểu':'Tư duy Khoa học'}</p>
<h3>${esc(q.text)}</h3>
${q.options.map((o,j)=>
btn(`<b>${'ABCD'[j]}.</b> ${esc(o)}`,'answer',`option ${run.answers[i]===j?'active':''}`,`data-n="${j}"`)
).join('')}
<hr>
<div class="row between">
${btn('← Trước','prev')}
${btn('Nộp bài','submit','primary')}
${btn('Tiếp →','next')}
</div>
<div class="numbers">
${e.questions.map((_,n)=>
btn(n+1,'jump',n===i?'active':run.answers[n]!==undefined?'done':'',`data-n="${n}"`)
).join('')}
</div>
</div>`;
}
}

else if(page==='result'){
const r=db.history.find(x=>x.id===resultId&&x.userId===uid);
html=r?`
<div class="card">
<h2>Kết quả bài thi</h2>
<h2 class="success">${r.score}/${r.total} câu đúng</h2>
<p>${esc(r.title)} · ${when(r.time)}</p>
${btn('Tải đáp án TXT','download-answer','',`data-id="${esc(r.id)}"`)}
${btn('Về kho đề','exams')}
<hr>
${r.details.map((q,i)=>`
<div class="question">
<b>Câu ${i+1}: ${esc(q.text)}</b>
<p>Bạn chọn: ${q.selected===null?'Bỏ trống':'ABCD'[q.selected]}</p>
<p class="success">Đáp án: ${'ABCD'[q.answer]}</p>
<p class="muted">${esc(q.explain)}</p>
</div>`).join('')}
</div>`:'<div class="card">Không tìm thấy kết quả.</div>';
}

else if(page==='history'){
const list=db.history.filter(r=>r.userId===uid).slice().reverse();
html=`
<h2>Lịch sử làm bài</h2>
${list.length?list.map(r=>`
<div class="card">
<b>${esc(r.title)}</b>
<p class="muted">${when(r.time)}</p>
<b>${r.score}/${r.total} câu</b>
${btn('Xem kết quả','view-result','',`data-id="${esc(r.id)}"`)}
</div>`).join(''):'<div class="card">Chưa có bài thi.</div>'}`;
}

else if(page==='profile'){
html=`
<div class="card">
<h2>Tài khoản</h2>
<p><b>Họ tên:</b> ${esc(u.name)}</p>
<p><b>Tài khoản:</b> ${esc(u.id)}</p>
<p><b>Vai trò:</b> ${owner()?'OWNER':'Học sinh'}</p>
<p><b>VIP:</b> ${vip()?'Đến '+when(u.vipUntil):'Chưa có hoặc đã hết hạn'}</p>
<p><b>Đề mua lẻ:</b> ${(u.unlocked||[]).length}</p>
</div>`;
}

else if(page==='admin'&&owner()){
html=`
<h2>Quản trị OWNER</h2>
<div class="card">
${btn('＋ Tạo đề','create','primary')}
${btn('Xuất dữ liệu JSON','backup')}
${btn('Nhập bản sao lưu','restore')}
<p class="muted">Nhập thêm đề từ tệp JSON:</p>
<input id="importExam" type="file" accept=".json,application/json">
</div>
${db.exams.map(e=>`
<div class="card">
<b>${esc(e.title)}</b>
<p class="muted">${e.questions.length} câu · ${e.minutes} phút</p>
${btn('Sửa đề','edit-exam','',`data-id="${esc(e.id)}"`)}
${btn('Xuất JSON','export-exam','',`data-id="${esc(e.id)}"`)}
${btn('Xóa đề','delete-exam','danger',`data-id="${esc(e.id)}"`)}
</div>`).join('')}
<div class="card">
<h3>Tài khoản trên thiết bị này</h3>
${db.users.map(x=>`<p>${esc(x.id)} — ${esc(x.name)} — ${esc(x.role)}</p>`).join('')}
</div>`;
}

else if(page==='edit-exam'&&owner()){
const e=exam();
html=e?`
<div class="card">
${btn('← Quản trị','admin')}
<h2>Sửa đề</h2>
<form id="examForm">
<label>Tên đề</label>
<input name="title" value="${esc(e.title)}" required>
<label>Thời gian (phút)</label>
<input name="minutes" type="number" min="1" max="600" value="${e.minutes}" required>
<button type="submit" class="primary">Lưu đề</button>
</form>
<hr>
<h3>Câu hỏi (${e.questions.length})</h3>
${btn('＋ Thêm câu hỏi','add-question','primary')}
${e.questions.map((q,i)=>`
<div class="question">
<b>Câu ${i+1}: ${esc(q.text)}</b>
<div>
${btn('Sửa','edit-question','',`data-n="${i}"`)}
${btn('Xóa','delete-question','danger',`data-n="${i}"`)}
</div>
</div>`).join('')}
</div>`:'';
}

else if(page==='edit-question'&&owner()){
const e=exam();
const q=editIndex<0?
{text:'',options:['','','',''],answer:0,explain:''}:
e?.questions[editIndex];
html=q?`
<div class="card">
${btn('← Sửa đề','edit-exam')}
<h2>${editIndex<0?'Thêm câu hỏi':'Sửa câu hỏi'}</h2>
<form id="questionForm">
<label>Nội dung câu hỏi</label>
<textarea name="text" required>${esc(q.text)}</textarea>
${q.options.map((o,i)=>`
<label>Đáp án ${'ABCD'[i]}</label>
<input name="option${i}" value="${esc(o)}" required>
`).join('')}
<label>Đáp án đúng</label>
<select name="answer">
${[0,1,2,3].map(i=>`
<option value="${i}" ${q.answer===i?'selected':''}>${'ABCD'[i]}</option>
`).join('')}
</select>
<label>Lời giải</label>
<textarea name="explain">${esc(q.explain)}</textarea>
<button type="submit" class="primary">Lưu câu hỏi</button>
</form>
</div>`:'';
}

$('app').innerHTML=nav+html;
}

function finish(){
const e=exam();
if(!e||!run)return;
const details=e.questions.map((q,i)=>({
text:q.text,
options:[...q.options],
answer:q.answer,
selected:run.answers[i]===undefined?null:run.answers[i],
explain:q.explain||''
}));
const r={
id:newId(),
userId:uid,
examId:e.id,
title:e.title,
time:Date.now(),
score:details.filter(x=>x.selected===x.answer).length,
total:details.length,
details
};
db.history.push(r);
resultId=r.id;
run=null;
page='result';
save();
render();
}

$('app').addEventListener('submit',ev=>{
ev.preventDefault();
const f=ev.target;
const d=new FormData(f);

if(f.id==='authForm'){
const username=String(d.get('username')||'').trim().toLowerCase();
const password=String(d.get('password')||'');

if(mode==='login'){
const u=db.users.find(x=>x.id===username&&x.password===password);
if(!u){
error='Sai tài khoản hoặc mật khẩu.';
render();
return;
}
uid=u.id;
}else{
const name=String(d.get('name')||'').trim();
if(!name||!username||password.length<6){
error='Nhập đủ thông tin và mật khẩu tối thiểu 6 ký tự.';
render();
return;
}
if(db.users.some(x=>x.id===username)){
error='Tài khoản đã tồn tại.';
render();
return;
}
db.users.push({
id:username,name,password,role:'guest',unlocked:[],vipUntil:0
});
uid=username;
}
error='';
page='exams';
save();
render();
return;
}

if(!owner())return;

if(f.id==='examForm'){
const e=exam();
if(!e)return;
e.title=String(d.get('title')||'').trim();
e.minutes=Math.max(1,Number(d.get('minutes'))||150);
save();
render();
}

if(f.id==='questionForm'){
const e=exam();
if(!e)return;
const q={
text:String(d.get('text')||'').trim(),
options:[0,1,2,3].map(i=>String(d.get('option'+i)||'').trim()),
answer:Number(d.get('answer')),
explain:String(d.get('explain')||'').trim()
};
if(!q.text||q.options.some(x=>!x)){
alert('Nhập đủ câu hỏi và 4 đáp án.');
return;
}
if(editIndex<0)e.questions.push(q);
else e.questions[editIndex]=q;
page='edit-exam';
save();
render();
}
});

$('app').addEventListener('change',async ev=>{
if(ev.target.id!=='importExam'||!owner())return;
const file=ev.target.files?.[0];
if(!file)return;
try{
const parsed=JSON.parse(await file.text());
const items=Array.isArray(parsed)?parsed:[parsed];
if(!items.length)throw Error('Tệp trống');
for(const e of items){
if(typeof e.title!=='string'||!Array.isArray(e.questions)||
!e.questions.every(q=>
typeof q.text==='string'&&
Array.isArray(q.options)&&
q.options.length===4&&
q.options.every(x=>typeof x==='string')&&
Number.isInteger(q.answer)&&q.answer>=0&&q.answer<=3
))throw Error('Cấu trúc câu hỏi không hợp lệ');
}
for(const e of items){
db.exams.push({
id:newId(),
title:e.title,
minutes:Number(e.minutes)||150,
questions:e.questions.map(q=>({
text:q.text,
options:[...q.options],
answer:q.answer,
explain:String(q.explain||'')
}))
});
}
save();
render();
alert('Đã nhập đề thành công.');
}catch(e){
alert('Không nhập được: '+e.message);
}
});

$('app').addEventListener('click',ev=>{
const b=ev.target.closest('button[data-act]');
if(!b)return;
const a=b.dataset.act;
const itemId=b.dataset.id;
const n=Number(b.dataset.n);

if(a==='login-mode'||a==='register-mode'){
mode=a==='login-mode'?'login':'register';
error='';
render();
return;
}

if(a==='logout'){
uid='';
run=null;
page='exams';
save();
render();
return;
}

if(!me())return;

if(['exams','history','profile','admin','detail','payment'].includes(a)){
if(a==='admin'&&!owner())return;
page=a;
render();
return;
}

if(a==='select'){
selected=itemId;
page='detail';
}

else if(a==='pay'){
const e=exam();
if(!e)return;
const p=$('app').querySelector('input[name="plan"]:checked')?.value||'single';
const u=me();
if(p==='vip'){
u.vipUntil=Math.max(Date.now(),Number(u.vipUntil)||0)+30*DAY;
}else{
