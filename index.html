function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){
const j=random(0,i);
[a[i],a[j]]=[a[j],a[i]];

function downloadFile(filename,content,type="application/json"){

function user(){
return db.users.find(x=>x.id===currentUser)||null;
}

function isOwner(){
return user()?.role==="owner";
}

function hasVip(){
return Number(user()?.vipUntil||0)>Date.now();
}

function exam(){
return db.exams.find(x=>x.id===selectedId)||null;

if(!user())return false;

math:"Tư duy Toán học",
reading:"Tư duy Đọc hiểu",

/* ================= CÂU HỎI ================= */

function makeQuestion(section,text,options,answer,explain,source,sourceURL="",kind="generated"){
return {
id:newId(),
section,
text,
options,
answer,
explain,
source,
sourceURL,
kind,
reviewed:false
};
}

function fingerprint(q){
return (q.section+"|"+q.text)
.toLowerCase()
.replace(/\s+/g," ")
.trim();
}

function addQuestions(questions){
const existing=new Set(db.bank.map(fingerprint));
let added=0;

for(const q of questions){
if(
!q||
!sections[q.section]||
typeof q.text!=="string"||
!Array.isArray(q.options)||
q.options.length!==4||
!q.options.every(x=>typeof x==="string")||
!Number.isInteger(q.answer)||
q.answer<0||
q.answer>3
)continue;

const key=fingerprint(q);

if(existing.has(key))continue;

db.bank.push(q);
existing.add(key);
added++;
}

save();
return added;
}

/* ================= TỰ SINH TOÁN ================= */

function numericQuestion(section,text,result,explain,source){
const values=[result];
let tries=0;

while(values.length<4&&tries++<100){
const delta=random(-12,12);
const value=result+delta;

if(
delta!==0&&
value>=0&&
!values.includes(value)
){
values.push(value);
}
}

while(values.length<4){
const value=values[values.length-1]+1;
if(!values.includes(value))values.push(value);
}

const options=shuffle(values);

return makeQuestion(
section,
text,
options.map(String),
options.indexOf(result),
explain,
source
);
}

);

return numericQuestion(
"math",
`Cho f(x) = ${a}x² + ${b}x + ${c}. Tính f'(${x}).`,

`f'(x) = ${2*a}x + ${b}.`,
"Bài toán tự sinh"
);

case 2:
return numericQuestion(
"math",
`Cấp số cộng có u₁ = ${a}, công sai d = ${b}. Giá trị u${n} là bao nhiêu?`,
a+(n-1)*b,
"uₙ = u₁ + (n−1)d.",
"Bài toán tự sinh"
);

case 3:
return numericQuestion(
"math",
`Một tam giác có đáy ${2*a} cm và chiều cao ${b} cm. Diện tích bằng bao nhiêu cm²?`,

);

case 4:
return numericQuestion(
"math",
`Giá trị log cơ số ${a} của ${a**x} bằng bao nhiêu?`,

"Bài toán tự sinh"
);

case 5:
return numericQuestion(
"math",
`Trung bình cộng của ${a}, ${a+2*b}, ${a+4*b} bằng bao nhiêu?`,
a+2*b,
"Lấy tổng ba số chia 3.",
"Bài toán tự sinh"
);

case 6:
return numericQuestion(
"math",
`Một người đi với vận tốc ${a} km/h trong ${b} giờ. Quãng đường bằng bao nhiêu km?`,
a*b,
"s = vt.",
"Bài toán tự sinh"
);

case 7:
return numericQuestion(
"math",
`Cho f(x) = ${a}x + ${b}. Tính f(${x}).`,
a*x+b,

);

case 8:
return numericQuestion(
"math",

2*(a+b),
"P = 2(dài + rộng).",

return numericQuestion(
"math",

a*(a+1)/2,
"S = n(n+1)/2.",
"Bài toán tự sinh"
);

case 10:
return numericQuestion(
"math",
`Một sản phẩm giá ${a*100} nghìn đồng, giảm 10%. Số tiền giảm là bao nhiêu nghìn đồng?`,
a*10,
"Lấy 10% giá ban đầu.",
"Bài toán tự sinh"
);

default:
return numericQuestion(
"math",
`Một hình vuông có cạnh ${a} cm. Diện tích bằng bao nhiêu cm²?`,
a*a,
"S = cạnh².",
"Bài toán tự sinh"

a*b*b,
"P = I²R.",
"Vật lý - bài tập tự sinh"

case 9:
return numericQuestion(
"science",
`Một vật có trọng lượng ${a*10} N. Lấy g = 10 m/s². Khối lượng của vật là bao nhiêu kg?`,

/* ================= INTERNET ================= */

async function searchWikipedia(term){
const params=new URLSearchParams({
action:"query",
generator:"search",
gsrsearch:term,
gsrnamespace:"0",
gsrlimit:"10",
prop:"extracts",
explaintext:"1",
exchars:"1100",
format:"json",
formatversion:"2",
origin:"*"
});

const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),12000);

try{
const response=await fetch(
"https://vi.wikipedia.org/w/api.php?"+params.toString(),
{
signal:controller.signal,
credentials:"omit"
}
);

if(!response.ok){
throw Error("HTTP "+response.status);
}

const data=await response.json();

if(data.error){
throw Error(data.error.info||"Wikipedia API lỗi");
}

return (data.query?.pages||[])
.filter(x=>typeof x.extract==="string"&&x.extract.length>160)
.map(x=>({
title:x.title,
text:x.extract.replace(/\s+/g," ").trim(),
url:"https://vi.wikipedia.org/wiki/"+encodeURIComponent(x.title.replace(/ /g,"_"))
}));

}finally{
clearTimeout(timeout);
}
}

/* ================= TẠO CÂU TỪ TÀI LIỆU ================= */

function extractSentences(text){
return (text.match(/[^.!?。]+[.!?。]?/g)||[])
.map(s=>s.trim())
.filter(s=>s.length>=55&&s.length<=250);
}

function questionsFromWikipedia(docs,section){
const output=[];

if(docs.length<4)return output;

for(const doc of docs){
const others=shuffle(
docs.filter(d=>d.title!==doc.title)
);

if(others.length<3)continue;

const passage=doc.text.slice(0,550).trim();

const titles=shuffle([
doc.title,
...others.slice(0,3).map(d=>d.title)
]);

output.push(
makeQuestion(
section,
`Đọc tư liệu:\n“${passage}”\n\nTư liệu chủ yếu đề cập đến chủ đề nào?`,
titles,
titles.indexOf(doc.title),
"Chủ đề phù hợp nhất là "+doc.title+".",
doc.title,
doc.url,
"web"
)
);

const correct=extractSentences(passage)[0];

const incorrect=others
.map(d=>extractSentences(d.text.slice(0,550))[0])
.filter(Boolean)
.slice(0,3);

if(
correct&&
incorrect.length===3&&
new Set([correct,...incorrect]).size===4
){
const opts=shuffle([correct,...incorrect]);

output.push(
makeQuestion(
section,
`Đọc tư liệu:\n“${passage}”\n\nThông tin nào xuất hiện trực tiếp trong đoạn trích?`,
opts,
opts.indexOf(correct),
"Phương án đúng xuất hiện trong tư liệu.",
doc.title,
doc.url,
"web"
)
);
}
}

return output;
}

/* ================= BỔ SUNG NGÂN HÀNG ================= */

function ensureOfflineBank(){
let added=0;
let tries=0;

while(
db.bank.filter(q=>q.section==="math").length<85&&
tries++<500
){
added+=addQuestions([generateMath()]);
}

tries=0;

while(
db.bank.filter(q=>q.section==="science").length<75&&
tries++<500
){
added+=addQuestions([generateScience()]);
}

added+=addQuestions(generateReading());

return added;
}

/* ================= TỰ TẠO ĐỀ ================= */

function makeExamFromBank(){
const quotas={
math:40,
reading:20,
science:40
};

let questions=[];
let missing=[];

for(const section of Object.keys(quotas)){
const pool=db.bank.filter(q=>q.section===section);

const web=shuffle(pool.filter(q=>q.kind==="web"));
const other=shuffle(pool.filter(q=>q.kind!=="web"));

const chosen=[...web,...other].slice(0,quotas[section]);

if(chosen.length<quotas[section]){
missing.push(
sections[section]+": thiếu "+(quotas[section]-chosen.length)+" câu"
);
}

questions.push(...chosen);
}

if(missing.length){
throw Error("Ngân hàng chưa đủ câu hỏi. "+missing.join("; "));
}

const finalQuestions=questions.map(q=>{
const order=shuffle([0,1,2,3]);

return {
...q,
id:newId(),
options:order.map(i=>q.options[i]),
answer:order.indexOf(q.answer)
};
});

const e={
id:newId(),
name:"Đề TSA tự động - "+new Date().toLocaleString("vi-VN"),
minutes:150,
questions:finalQuestions,
published:false,
created:Date.now(),
automatic:true
};

db.exams.unshift(e);
selectedId=e.id;
save();

return e;
}

<div class="card">
<h2>Kết quả bài thi</h2>

<h2 class="success">${r.score}/${r.total} câu đúng</h2>

<p>${esc(r.name)}</p>
<p class="muted">${formatDate(r.time)}</p>

${btn("Tải đáp án TXT","downloadAnswers","green")}
${btn("Về kho đề","exams")}

<hr>

${r.details.map((q,i)=>`
<div class="question">
<b>Câu ${i+1}:</b>

<p style="white-space:pre-wrap">${esc(q.text)}</p>

<p>Bạn chọn: ${q.chosen===null?"Bỏ trống":"ABCD"[q.chosen]}</p>

<p class="success">
Đáp án đúng: ${"ABCD"[q.answer]}
</p>

<p>${esc(q.explain||"")}</p>

<p class="muted">${sourceView(q)}</p>
</div>
`).join("")}
</div>`:'<div class="card">Không tìm thấy kết quả.</div>';
}

/* LỊCH SỬ */

else if(page==="history"){
const records=db.history
.filter(x=>x.userId===currentUser)
.slice()
.reverse();

h=`
<h2>📊 Lịch sử làm bài</h2>

${records.map(r=>`
<div class="card">
<b>${esc(r.name)}</b>
<p>${r.score}/${r.total} câu đúng</p>
<p class="muted">${formatDate(r.time)}</p>

${btn("Xem kết quả","viewResult","",`data-id="${esc(r.id)}"`)}
</div>
`).join("")||'<div class="card">Chưa có lịch sử làm bài.</div>'}
`;
}

/* TÀI KHOẢN */

else if(page==="profile"){
h=`
<div class="card">
<h2>👤 Tài khoản</h2>

<p><b>Họ tên:</b> ${esc(u.name)}</p>
<p><b>Tài khoản:</b> ${esc(u.id)}</p>
<p><b>Vai trò:</b> ${isOwner()?"OWNER":"Học sinh"}</p>

<p><b>VIP:</b> ${
hasVip()?"Có hiệu lực đến "+formatDate(u.vipUntil):
"Chưa kích hoạt hoặc đã hết hạn"
}</p>

<p><b>Đề mua lẻ:</b> ${(u.bought||[]).length}</p>

<p class="warning">
Phiên bản HTML GitHub Pages lưu dữ liệu cục bộ, chưa có xác thực bảo mật hoặc thanh toán thật.
</p>
</div>`;
}

$("app").innerHTML=nav+h;
}

/* ================= FORM CÂU HỎI ================= */

function questionForm(q,formId){
return `
<div class="card">

${btn("← Quay lại",formId==="bankForm"?"bank":"editExam")}

<h2>Biên tập câu hỏi</h2>

<form id="${formId}">

<label>Phần thi</label>
<select name="section">
${Object.keys(sections).map(k=>`
<option value="${k}" ${q.section===k?"selected":""}>
${sections[k]}
</option>
`).join("")}
</select>

<label>Nội dung câu hỏi</label>
<textarea name="text" required>${esc(q.text)}</textarea>

${q.options.map((option,i)=>`
<label>Đáp án ${"ABCD"[i]}</label>
<input name="option${i}" value="${esc(option)}" required>
`).join("")}

<label>Đáp án đúng</label>
<select name="answer">
${[0,1,2,3].map(i=>`
<option value="${i}" ${q.answer===i?"selected":""}>
${"ABCD"[i]}
</option>
`).join("")}
</select>

<label>Lời giải</label>
<textarea name="explain">${esc(q.explain)}</textarea>

<label>Nguồn</label>
<input name="source" value="${esc(q.source||"OWNER")}">

<label>URL nguồn</label>
<input name="sourceURL" value="${esc(q.sourceURL||"")}">

<button type="submit" class="red">
Lưu câu hỏi
</button>

</form>
</div>`;
}

/* ================= CHẤM BÀI ================= */

function finishExam(){
const e=exam();

if(!e||!attempt)return;

const details=e.questions.map((q,i)=>({
...q,
chosen:attempt.answers[i]===undefined?
null:attempt.answers[i]
}));

const result={
id:newId(),
userId:currentUser,
name:e.name,
time:Date.now(),
score:details.filter(q=>q.answer===q.chosen).length,
total:details.length,
details
};

db.history.push(result);
resultId=result.id;
attempt=null;
page="result";

save();
render();
}

/* ================= XỬ LÝ FORM ================= */

$("app").addEventListener("submit",ev=>{
ev.preventDefault();

const form=ev.target;
const data=new FormData(form);

if(form.id==="authForm"){
const username=String(data.get("username")||"")
.trim()
.toLowerCase();

const password=String(data.get("password")||"");

if(authMode==="login"){
const u=db.users.find(x=>
x.id===username&&x.password===password
);

if(!u){
authError="Sai tài khoản hoặc mật khẩu.";
render();
return;
}

currentUser=u.id;

}else{
const name=String(data.get("name")||"").trim();

if(!name||!username||password.length<6){
authError="Nhập đủ thông tin, mật khẩu ít nhất 6 ký tự.";
render();
return;
}

if(db.users.some(x=>x.id===username)){
authError="Tên tài khoản đã tồn tại.";
render();
return;
}

db.users.push({
id:username,
name,
password,
role:"guest",
bought:[],
vipUntil:0
});

currentUser=username;
}

authError="";
page="exams";

save();
render();

if(
isOwner()&&
db.autoEnabled&&
Date.now()-Number(db.lastAuto||0)>DAY
){
autoCreate();
}

return;
}

if(!isOwner())return;

if(form.id==="examForm"){
const e=exam();
if(!e)return;

e.name=String(data.get("name")||"").trim();
e.minutes=Math.max(
1,
Math.min(600,Number(data.get("minutes"))||150)
);

save();
render();
return;
}

if(["questionForm","bankForm"].includes(form.id)){
const q={
id:newId(),
section:String(data.get("section")),
text:String(data.get("text")||"").trim(),
options:[0,1,2,3].map(i=>
String(data.get("option"+i)||"").trim()
),
answer:Number(data.get("answer")),
explain:String(data.get("explain")||""),
source:String(data.get("source")||"OWNER"),
sourceURL:String(data.get("sourceURL")||""),
kind:"manual",
reviewed:true
};

if(!q.text||q.options.some(x=>!x)){
alert("Nhập đủ câu hỏi và 4 đáp án.");
return;
}

if(form.id==="bankForm"){
const index=db.bank.findIndex(x=>x.id===editingBankId);

if(index>=0){
q.id=db.bank[index].id;
db.bank[index]=q;
}else{
db.bank.push(q);
}

page="bank";

}else{
const e=exam();
if(!e)return;

if(editingIndex<0){
e.questions.push(q);
}else{
q.id=e.questions[editingIndex].id;
e.questions[editingIndex]=q;
}

page="editExam";
}

save();
render();
}
});

/* ================= TỰ ĐỘNG THEO CHU KỲ ================= */

$("app").addEventListener("change",ev=>{
if(ev.target.id==="autoEnabled"&&isOwner()){
db.autoEnabled=ev.target.checked;
save();
}
});

/* ================= NÚT BẤM ================= */

$("app").addEventListener("click",async ev=>{
const b=ev.target.closest("button[data-action]");

if(!b)return;

const action=b.dataset.action;
const itemId=b.dataset.id;
const index=Number(b.dataset.index);

if(action==="loginMode"||action==="registerMode"){
authMode=action==="loginMode"?"login":"register";
authError="";
render();
return;
}

if(action==="logout"){
currentUser="";
attempt=null;
page="exams";
save();
render();
return;
}

if(!user())return;

if([
"exams",
"history",
"profile",
"admin",
"detail",
"payment",
"bank",
"editExam"
].includes(action)){
if(
["admin","bank","editExam"].includes(action)&&
!isOwner()
)return;

page=action;
render();
return;
}

if(action==="select"){
selectedId=itemId;
page="detail";
}

else if(action==="pay"){
const e=exam();

if(!e)return;

const chosen=$("app").querySelector(
'input[name="plan"]:checked'
)?.value||"single";

if(chosen==="vip"){
user().vipUntil=Math.max(
Date.now(),
Number(user().vipUntil)||0
)+VIP_DAYS*DAY;

}else{
user().bought=user().bought||[];

if(!user().bought.includes(e.id)){
user().bought.push(e.id);
}
}

page="detail";
save();
}

else if(action==="start"){
const e=exam();

if(!e||!canOpen(e))return;

if(!e.questions.length){
alert("Đề chưa có câu hỏi.");
return;
}

attempt={
index:0,
answers:{},
deadline:Date.now()+e.minutes*60000
};

page="room";
}

else if(action==="answer"&&attempt){
attempt.answers[attempt.index]=index;
}

else if(action==="jump"&&attempt){
attempt.index=index;
}

else if(action==="prev"&&attempt){
attempt.index=Math.max(0,attempt.index-1);
}

else if(action==="next"&&attempt){
attempt.index=Math.min(
exam().questions.length-1,
attempt.index+1
);
}

else if(action==="submit"&&attempt){
if(confirm("Bạn chắc chắn muốn nộp bài?")){
finishExam();
}
return;
}

else if(action==="viewResult"){
resultId=itemId;
page="result";
}

else if(action==="downloadAnswers"){
const r=db.history.find(x=>
x.id===resultId&&x.userId===currentUser
);

if(!r)return;

const text=[
r.name,
"Điểm: "+r.score+"/"+r.total,
...r.details.map((q,i)=>`
Câu ${i+1}: ${q.text}
Đáp án đúng: ${"ABCD"[q.answer]}
Bạn chọn: ${q.chosen===null?"Bỏ trống":"ABCD"[q.chosen]}
Lời giải: ${q.explain}
Nguồn: ${q.sourceURL||q.source}
`)
].join("\n\n");

downloadFile(
"dap-an-tsa.txt",
text,
"text/plain;charset=utf-8"
);

return;
}

else if(isOwner()){

if(action==="autoCreate"){
autoCreate();
return;
}

if(action==="generateOffline"){
const n=ensureOfflineBank();

alert(
"Đã bổ sung "+n+
" câu hỏi mới. Ngân hàng hiện có "+
db.bank.length+" câu."
);

render();
return;
}

if(action==="assemble"){
try{
const e=makeExamFromBank();

alert(
"Đã tự tạo đề "+e.questions.length+
" câu. Đề đang ở trạng thái NHÁP."
);
}catch(e){
alert(e.message);
}

render();
return;
}

if(action==="createExam"){
const e={
id:newId(),
name:"Đề TSA mới",
minutes:150,
questions:[],
published:false,
created:Date.now()
};

db.exams.unshift(e);
selectedId=e.id;
page="editExam";
save();
}

else if(action==="editExam"){
selectedId=itemId||selectedId;
page="editExam";
}

else if(action==="deleteExam"){
const e=db.exams.find(x=>x.id===itemId);

if(e&&confirm("Xóa vĩnh viễn đề '"+e.name+"'?")){
db.exams=db.exams.filter(x=>x.id!==itemId);
save();
}
}

else if(action==="publish"){
const e=db.exams.find(x=>x.id===itemId);

if(e){
if(
e.published===false&&
e.questions.length===0
){
alert("Không thể xuất bản đề trống.");
return;
}

e.published=e.published===false;
save();
}
}

else if(action==="addQuestion"){
editingIndex=-1;
page="editQuestion";
}

else if(action==="editQuestion"){
editingIndex=index;
page="editQuestion";
}

else if(action==="deleteQuestion"){
const e=exam();

if(e&&confirm("Xóa câu "+(index+1)+"?")){
e.questions.splice(index,1);
save();
}
}

else if(action==="addBank"){
editingBankId="";
page="editBank";
}

else if(action==="editBank"){
editingBankId=itemId;
page="editBank";
}

else if(action==="deleteBank"){
if(confirm("Xóa câu hỏi khỏi ngân hàng?")){
db.bank=db.bank.filter(x=>x.id!==itemId);
save();
}
}

else if(action==="backup"){
downloadFile(
"tsa-backup.json",
JSON.stringify(db,null,2)
);
return;
}

else if(action==="exportBank"){
downloadFile(
"tsa-ngan-hang.json",
JSON.stringify(db.bank,null,2)
);
return;
}

else if(action==="exportExam"){
const e=db.exams.find(x=>x.id===itemId);

if(e){
downloadFile(
"de-tsa-"+e.id+".json",
JSON.stringify(e,null,2)
);
}
return;
}

else if(action==="import"||action==="restore"){
const input=document.createElement("input");
input.type="file";
input.accept=".json,application/json";

input.onchange=async()=>{
try{
const file=input.files?.[0];
if(!file)return;

const raw=JSON.parse(await file.text());

if(action==="restore"){
if(
!raw||
!Array.isArray(raw.users)||
!Array.isArray(raw.exams)||
!Array.isArray(raw.bank)||
!Array.isArray(raw.history)
){
throw Error("Bản sao lưu không hợp lệ.");
}

if(!confirm("Thay thế toàn bộ dữ liệu hiện tại?")){
return;
}

db=raw;
currentUser="";
attempt=null;
page="exams";

}else if(
Array.isArray(raw)&&
raw.length>0&&
raw.every(x=>x.section&&(x.text||x.t))
){
const incoming=raw.map(x=>({
id:newId(),
section:x.section,
text:x.text||x.t,
options:x.options||x.o,
answer:Number(x.answer??x.a),
explain:x.explain||x.e||"",
source:x.source||"Nhập từ JSON",
sourceURL:x.sourceURL||"",
kind:"import",
reviewed:false
}));

const count=addQuestions(incoming);

alert("Đã nhập "+count+" câu hỏi.");

}else{
const items=Array.isArray(raw)?raw:[raw];

for(const item of items){
if(!Array.isArray(item.questions)){
throw Error("Tệp thiếu mảng questions.");
}

const questions=item.questions.map(q=>({
id:newId(),
section:q.section||"math",
text:q.text||q.t,
options:q.options||q.o,
answer:Number(q.answer??q.a),
explain:q.explain||q.e||"",
source:q.source||"Nhập từ JSON",
sourceURL:q.sourceURL||"",
kind:"import",
reviewed:false
}));

if(questions.some(q=>
!q.text||
!Array.isArray(q.options)||
q.options.length!==4||
!Number.isInteger(q.answer)||
q.answer<0||
q.answer>3
)){
throw Error("Có câu hỏi không hợp lệ.");
}

db.exams.push({
id:newId(),
name:String(item.name||item.title||"Đề nhập JSON"),
minutes:Number(item.minutes)||150,
questions,
published:false,
created:Date.now()
});
}
}

save();
render();

}catch(e){
alert("Lỗi nhập JSON: "+e.message);
}
};

input.click();
return;
}
}

render();
});

/* ================= ĐỒNG HỒ ================= */

setInterval(()=>{
if(page!=="room"||!attempt)return;

const seconds=Math.max(
0,
Math.ceil((attempt.deadline-Date.now())/1000)
);

const timer=$("timer");

if(timer){
timer.textContent=
"⏱ "+
Math.floor(seconds/60)+":"+
String(seconds%60).padStart(2,"0");
}

if(seconds===0){
finishExam();
}
},1000);

/* ================= BẮT LỖI ================= */

window.addEventListener("error",e=>{
errorBox("Lỗi JavaScript: "+e.message);
});

window.addEventListener("unhandledrejection",e=>{
errorBox("Lỗi xử lý: "+String(e.reason));
});

/* ================= KHỞI ĐỘNG ================= */

try{
render();

if(
user()&&
isOwner()&&
db.autoEnabled&&
Date.now()-Number(db.lastAuto||0)>DAY
){
autoCreate();
}

}catch(e){
errorBox("Lỗi khởi động: "+e.message);

$("app").innerHTML=
'<div class="card">Ứng dụng gặp lỗi khởi động. Vui lòng xem thông báo phía trên.</div>';
}

})();
</script>

</body>
</html>
